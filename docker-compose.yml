# Coolify: New Resource → Docker Compose (from this repo). Fill in the two variables it flags.
services:
  portal-builder:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_URL_PORTAL_BUILDER_4300           # Coolify assigns the domain and routes it to port 4300
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_PORTALBUILDER}   # generated by Coolify; shown under Environment Variables
      - GH_TOKEN=${GH_TOKEN:?}                    # GitHub token with repo + workflow scope for the owners you publish to
      - GIT_NAME=${GIT_NAME:-Omshivaprakash}
      - GIT_EMAIL=${GIT_EMAIL:-omshivaprakash@gmail.com}
    volumes:
      - portal-data:/app/data                     # project configs, logos, favicons
      - portal-workspace:/app/workspace           # generated sites and their git clones

volumes:
  portal-data:
  portal-workspace:
