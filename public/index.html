<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Builder</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --mute:#6b6a64; --line:#dcdad2; --acc:#8a3b12; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; min-height:100vh; }
  aside { width:230px; background:#27231e; color:#eee; padding:16px; flex-shrink:0; }
  aside h1 { font-size:15px; margin:0 0 14px; letter-spacing:.04em; }
  aside button.item { display:block; width:100%; text-align:left; background:none; border:0; color:#ddd; padding:7px 8px; border-radius:4px; cursor:pointer; font:inherit; }
  aside button.item:hover, aside button.item.on { background:#3b352d; color:#fff; }
  aside .new { margin-top:12px; color:#f3c9a8; }
  main { flex:1; padding:20px 28px; max-width:1100px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--mute); }
  input, textarea, select { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; margin-top:3px; }
  textarea { min-height:60px; resize:vertical; }
  .wide { grid-column:1/-1; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; align-items:center; }
  button.b { padding:8px 14px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; font:inherit; }
  button.b.pri { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.b:disabled { opacity:.5; cursor:wait; }
  .hint { color:var(--mute); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  td input { margin:0; border-color:transparent; }
  td input:focus, td input:hover { border-color:var(--line); }
  .scroll { max-height:380px; overflow:auto; }
  pre { background:#1d1d1b; color:#d8d6cc; padding:12px; border-radius:4px; max-height:300px; overflow:auto; white-space:pre-wrap; font-size:12px; }
  .ok { color:#1a7f37; } .err { color:#b42318; }
  #empty { color:var(--mute); margin-top:60px; text-align:center; }
</style>
</head>
<body>
<aside>
  <h1>PORTAL BUILDER</h1>
  <div id="list"></div>
  <button class="item new" id="newBtn">+ New portal</button>
</aside>
<main>
  <div id="empty">Pick a portal on the left, or create a new one.</div>
  <form id="form" hidden>
    <div class="grid">
      <label>Slug (also the GitHub repo name)<input name="slug" required pattern="[a-z0-9][a-z0-9\-]*"></label>
      <label>GitHub org / user<input name="org" required></label>
      <label>Subdomain<input name="sub" placeholder="defaults to slug"></label>
      <label>Base domain<input name="domain" required></label>
      <label class="wide">Title<input name="title" required></label>
      <label class="wide">Tagline (navbar)<input name="tagline"></label>
      <label class="wide">Description (info panel + meta tags)<textarea name="description"></textarea></label>
      <label>Publisher / meta author<input name="author"></label>
      <label>Language code<input name="lang"></label>
      <label>"Read" label on cards<input name="readLabel"></label>
      <label>Google Analytics ID (optional)<input name="gaId"></label>
      <label class="wide">Internet Archive query
        <input name="query" placeholder="collection:ServantsOfKnowledge AND identifier:jst.*" style="font-family:monospace">
      </label>
      <label class="wide">Common item description (blank = use each item's own IA description)<textarea name="info"></textarea></label>
      <label>Logo (PNG, optional)<input type="file" id="logo" accept="image/png"></label>
    </div>

    <div class="bar">
      <button type="button" class="b" id="fetchBtn">Fetch items from IA</button>
      <button type="submit" class="b">Save</button>
      <button type="button" class="b" id="previewBtn">Preview</button>
      <button type="button" class="b pri" id="launchBtn">Launch / Push to GitHub</button>
      <button type="button" class="b" id="dupBtn">Duplicate as new</button>
      <button type="button" class="b" id="delBtn">Remove</button>
      <span class="hint" id="count"></span>
    </div>
    <p class="hint" id="dns"></p>

    <div class="scroll"><table>
      <thead><tr><th>Identifier</th><th>Title</th><th>Author</th><th>Year</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <h3>Log</h3>
    <pre id="log">—</pre>
  </form>
</main>

<script>
const $ = (s) => document.querySelector(s);
const form = $('#form');
let projects = {}, cur = null; // cur = project object being edited

const api = async (method, path, body) => {
  const r = await fetch('/api/' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const log = (t, cls = '') => { $('#log').innerHTML = `<span class="${cls}">${t.replace(/</g, '&lt;')}</span>`; };

const DEFAULTS = { org: 'sanchaya', domain: 'sanchaya.net', lang: 'kn', readLabel: 'ಓದಿರಿ', gaId: 'G-RRZLCXBXJZ', author: 'Sanchaya', books: [] };

function renderList() {
  $('#list').innerHTML = '';
  Object.keys(projects).sort().forEach((slug) => {
    const b = document.createElement('button');
    b.className = 'item' + (cur && cur.slug === slug ? ' on' : '');
    b.textContent = projects[slug].title || slug;
    b.onclick = () => open(projects[slug]);
    $('#list').append(b);
  });
}

function open(p) {
  cur = JSON.parse(JSON.stringify(p));
  $('#empty').hidden = true; form.hidden = false;
  for (const el of form.elements) if (el.name) el.value = cur[el.name] ?? '';
  form.slug.readOnly = !!projects[cur.slug];
  renderRows(); renderList(); log('—');
}

function readForm() {
  for (const el of form.elements) if (el.name) cur[el.name] = el.value.trim();
  return cur;
}

function renderRows() {
  const host = `${cur.sub || cur.slug || '<sub>'}.${cur.domain || ''}`;
  $('#count').textContent = `${cur.books.length} items`;
  $('#dns').textContent = `DNS: ${cur.sub || cur.slug || '<sub>'}  CNAME  ${(cur.org || '').toLowerCase()}.github.io.   →  https://${host}`;
  const tb = $('#rows'); tb.innerHTML = '';
  cur.books.forEach((b, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="hint">${b.identifier}</td>`;
    for (const k of ['title', 'author', 'level']) {
      const td = document.createElement('td'), inp = document.createElement('input');
      inp.value = b[k]; if (k === 'level') inp.style.width = '70px';
      inp.oninput = () => { b[k] = k === 'level' && inp.value !== '' ? Number(inp.value) || '' : inp.value; };
      td.append(inp); tr.append(td);
    }
    const x = document.createElement('td'), btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = '✕'; btn.className = 'b'; btn.onclick = () => { cur.books.splice(i, 1); renderRows(); };
    x.append(btn); tr.append(x); tb.append(tr);
  });
}

async function persist() {
  readForm();
  await api('PUT', 'projects', cur);
  projects[cur.slug] = JSON.parse(JSON.stringify(cur));
  form.slug.readOnly = true; renderList();
}

// Run an async action with the buttons disabled; surface errors in the log.
async function busy(fn) {
  const bs = [...document.querySelectorAll('button.b')]; bs.forEach((b) => (b.disabled = true));
  try { await fn(); } catch (e) { log(e.message, 'err'); } finally { bs.forEach((b) => (b.disabled = false)); }
}

$('#newBtn').onclick = () => open({ ...DEFAULTS, books: [] });
form.onsubmit = (e) => { e.preventDefault(); busy(async () => { await persist(); log('Saved.', 'ok'); }); };
form.slug.oninput = () => { if (!form.sub.value) cur.sub = ''; };
for (const n of ['slug', 'sub', 'domain', 'org']) form[n].addEventListener('input', () => { readForm(); renderRows(); });

$('#fetchBtn').onclick = () => busy(async () => {
  readForm(); log('Querying archive.org…');
  const r = await api('POST', 'fetch', { query: cur.query, info: cur.info, books: cur.books });
  cur.books = r.books; renderRows(); log(`${r.added} new item(s) added. Review, then Save.`, 'ok');
});

$('#logo').onchange = (e) => busy(async () => {
  const f = e.target.files[0]; if (!f) return;
  if (!cur.slug) throw new Error('Set the slug first');
  const dataUrl = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
  await api('POST', 'logo/' + cur.slug, { dataUrl }); log('Logo stored.', 'ok');
});

$('#previewBtn').onclick = () => busy(async () => {
  await persist(); const r = await api('POST', 'build/' + cur.slug); window.open(r.preview, '_blank');
});

$('#launchBtn').onclick = () => busy(async () => {
  await persist();
  if (!confirm(`Commit and push ${cur.org}/${cur.slug} to GitHub (master + gh-pages)?`)) return;
  log('Launching…');
  const r = await api('POST', 'launch/' + cur.slug);
  log(r.log.join('\n'), r.ok ? 'ok' : 'err');
});

$('#dupBtn').onclick = () => open({ ...readForm(), slug: '', sub: '', books: [] });
$('#delBtn').onclick = () => busy(async () => {
  if (!projects[cur.slug] || !confirm('Remove from this list? (The GitHub repo and local workspace folder are untouched.)')) return;
  await api('DELETE', 'projects/' + cur.slug); delete projects[cur.slug];
  cur = null; form.hidden = true; $('#empty').hidden = false; renderList();
});

api('GET', 'projects').then((p) => { projects = p; renderList(); });
</script>
</body>
</html>
