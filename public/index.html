<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Builder</title>
<style>
  :root { --ink:#1a1a1a; --mute:#767676; --line:#e6e6e6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, sans-serif; background:#fff; color:var(--ink); display:flex; min-height:100vh; }
  aside { width:220px; border-right:1px solid var(--line); padding:20px 14px; flex-shrink:0; }
  aside h1 { font-size:13px; font-weight:600; letter-spacing:.08em; margin:0 0 16px 8px; }
  aside button.item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--mute); padding:7px 8px; border-radius:4px; cursor:pointer; font:inherit; }
  aside button.item:hover, aside button.item.on { color:var(--ink); background:#f5f5f5; }
  aside .new { margin-top:12px; color:var(--ink) !important; }
  main { flex:1; padding:24px 36px 60px; max-width:1000px; }
  fieldset { border:0; border-top:1px solid var(--line); margin:0 0 8px; padding:14px 0 6px; }
  legend { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); padding:0 10px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px 16px; }
  label { display:block; font-size:12px; color:var(--mute); }
  input, textarea, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:4px; font:inherit; color:var(--ink); background:#fff; margin-top:3px; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:#999; }
  textarea { min-height:60px; resize:vertical; }
  .wide { grid-column:1/-1; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 6px; align-items:center; position:sticky; bottom:0; background:#fff; padding:10px 0; border-top:1px solid var(--line); }
  button.b { padding:7px 14px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; font:inherit; color:var(--ink); }
  button.b:hover { border-color:#999; }
  button.b.pri { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.b:disabled { opacity:.5; cursor:wait; }
  .hint { color:var(--mute); font-size:12px; }
  .asset { display:flex; gap:12px; align-items:center; }
  .asset img { height:44px; max-width:120px; object-fit:contain; border:1px solid var(--line); border-radius:4px; padding:3px; }
  .asset img:not([src]) { visibility:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { font-size:12px; color:var(--mute); font-weight:500; }
  th, td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  td input { margin:0; border-color:transparent; }
  td input:focus, td input:hover { border-color:var(--line); }
  .scroll { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:4px; }
  pre { background:#fafafa; border:1px solid var(--line); padding:12px; border-radius:4px; max-height:280px; overflow:auto; white-space:pre-wrap; font-size:12px; }
  .ok { color:#1a7f37; } .err { color:#b42318; }
  #empty { color:var(--mute); margin-top:80px; text-align:center; }
</style>
</head>
<body>
<aside>
  <h1>PORTAL BUILDER</h1>
  <div id="list"></div>
  <button class="item new" id="newBtn">+ New portal</button>
</aside>
<main>
  <div id="empty">Pick a portal on the left, or create a new one.</div>
  <form id="form" hidden>
    <fieldset><legend>Portal</legend><div class="grid">
      <label class="wide">Title<input name="title" required></label>
      <label class="wide">Tagline (shown under the title)<input name="tagline"></label>
      <label class="wide">Description (info panel and link previews)<textarea name="description"></textarea></label>
      <label>Organization name<input name="orgName" placeholder="e.g. Janapada Seva Trust"></label>
      <label>Organization website (optional)<input name="orgUrl" placeholder="https://"></label>
      <label>Language code<input name="lang"></label>
      <label>Label on item cards<input name="readLabel"></label>
      <label>Items open in
        <select name="openMode">
          <option value="tab">A new tab</option>
          <option value="frame">An in-page frame (with “open in new tab” link)</option>
        </select>
      </label>
    </div></fieldset>

    <fieldset><legend>Items from Internet Archive</legend><div class="grid">
      <label class="wide">Query<input name="query" placeholder="collection:ServantsOfKnowledge AND identifier:jst.*" style="font-family:monospace"></label>
      <label class="wide">Common item description (blank = each item's own IA description)<textarea name="info"></textarea></label>
    </div></fieldset>

    <fieldset><legend>GitHub &amp; domain</legend><div class="grid">
      <label>GitHub owner (org or user)<input name="owner" required></label>
      <label>New repo name<input name="repo" placeholder="defaults to the slug"></label>
      <label>Slug (local folder id)<input name="slug" required pattern="[a-z0-9][a-z0-9\-]*"></label>
      <label>Subdomain<input name="sub" placeholder="defaults to the slug"></label>
      <label>Base domain<input name="domain" required></label>
    </div>
    <p class="hint" id="dns"></p></fieldset>

    <fieldset><legend>Look</legend><div class="grid">
      <label>Logo (PNG)
        <span class="asset"><img id="logoPrev" alt=""><input type="file" id="logo" accept="image/png"></span>
      </label>
      <label>Favicon (square PNG, optional)
        <span class="asset"><img id="favPrev" alt=""><input type="file" id="favicon" accept="image/png"></span>
      </label>
      <label class="wide">“See also” links, one per line: Name | https://site | optional logo URL<textarea name="partners" placeholder="Sanchaya | https://sanchaya.org"></textarea></label>
      <label class="wide">Footer text (blank = “Published by &lt;organization&gt;.”)<input name="footer"></label>
      <label>Google Analytics ID (optional)<input name="gaId"></label>
    </div></fieldset>

    <fieldset><legend id="count">Items</legend>
      <div class="scroll"><table>
        <thead><tr><th>Identifier</th><th>Title</th><th>Author</th><th>Year</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </fieldset>

    <div class="bar">
      <button type="button" class="b" id="fetchBtn">Fetch items from IA</button>
      <button type="submit" class="b">Save</button>
      <button type="button" class="b" id="previewBtn">Preview</button>
      <button type="button" class="b pri" id="launchBtn">Launch / Push to GitHub</button>
      <button type="button" class="b" id="dupBtn">Duplicate as new</button>
      <button type="button" class="b" id="delBtn">Remove</button>
    </div>
    <pre id="log">—</pre>
  </form>
</main>

<script>
const $ = (s) => document.querySelector(s);
const form = $('#form');
let projects = {}, cur = null; // cur = project being edited

const api = async (method, path, body) => {
  const r = await fetch('/api/' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const log = (t, cls = '') => { $('#log').innerHTML = `<span class="${cls}">${t.replace(/</g, '&lt;')}</span>`; };

const DEFAULTS = { owner: 'sanchaya', domain: 'sanchaya.net', lang: 'kn', readLabel: 'ಓದಿರಿ', gaId: 'G-RRZLCXBXJZ', openMode: 'tab', orgName: '', books: [] };

function renderList() {
  $('#list').innerHTML = '';
  Object.keys(projects).sort().forEach((slug) => {
    const b = document.createElement('button');
    b.className = 'item' + (cur && cur.slug === slug ? ' on' : '');
    b.textContent = projects[slug].title || slug;
    b.onclick = () => open(projects[slug]);
    $('#list').append(b);
  });
}

// Show a stored asset if the project is saved and has one; hidden on 404.
function showAsset(img, kind) {
  img.removeAttribute('src');
  if (cur.slug && projects[cur.slug]) img.src = `/assets/${cur.slug}/${kind}.png?t=${Date.now()}`;
  img.onerror = () => img.removeAttribute('src');
}

function open(p) {
  cur = JSON.parse(JSON.stringify(p));
  $('#empty').hidden = true; form.hidden = false;
  for (const el of form.elements) if (el.name) el.value = cur[el.name] ?? '';
  form.slug.readOnly = !!projects[cur.slug];
  showAsset($('#logoPrev'), 'logo'); showAsset($('#favPrev'), 'favicon');
  renderRows(); renderList(); log('—'); window.scrollTo(0, 0);
}

function readForm() {
  for (const el of form.elements) if (el.name) cur[el.name] = el.value.trim();
  return cur;
}

function renderRows() {
  const sub = cur.sub || cur.slug || '<sub>';
  $('#count').textContent = `Items (${cur.books.length})`;
  $('#dns').textContent = `Repo: ${cur.owner}/${cur.repo || cur.slug || '<repo>'}   ·   DNS: ${sub}  CNAME  ${(cur.owner || '').toLowerCase()}.github.io.   →   https://${sub}.${cur.domain || ''}`;
  const tb = $('#rows'); tb.innerHTML = '';
  cur.books.forEach((b, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="hint">${b.identifier}</td>`;
    for (const k of ['title', 'author', 'level']) {
      const td = document.createElement('td'), inp = document.createElement('input');
      inp.value = b[k]; if (k === 'level') inp.style.width = '70px';
      inp.oninput = () => { b[k] = k === 'level' && inp.value !== '' ? Number(inp.value) || '' : inp.value; };
      td.append(inp); tr.append(td);
    }
    const x = document.createElement('td'), btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = '✕'; btn.className = 'b'; btn.onclick = () => { cur.books.splice(i, 1); renderRows(); };
    x.append(btn); tr.append(x); tb.append(tr);
  });
}

async function persist() {
  readForm();
  await api('PUT', 'projects', cur);
  projects[cur.slug] = JSON.parse(JSON.stringify(cur));
  form.slug.readOnly = true; renderList();
}

// Run an async action with the buttons disabled; surface errors in the log.
async function busy(fn) {
  const bs = [...document.querySelectorAll('button.b')]; bs.forEach((b) => (b.disabled = true));
  try { await fn(); } catch (e) { log(e.message, 'err'); } finally { bs.forEach((b) => (b.disabled = false)); }
}

$('#newBtn').onclick = () => open({ ...DEFAULTS, books: [] });
form.onsubmit = (e) => { e.preventDefault(); busy(async () => { await persist(); log('Saved.', 'ok'); }); };
for (const n of ['slug', 'sub', 'domain', 'owner', 'repo']) form[n].addEventListener('input', () => { readForm(); renderRows(); });

$('#fetchBtn').onclick = () => busy(async () => {
  readForm(); log('Querying archive.org…');
  const r = await api('POST', 'fetch', { query: cur.query, info: cur.info, books: cur.books });
  cur.books = r.books; renderRows(); log(`${r.added} new item(s) added. Review, then Save.`, 'ok');
});

// Logo / favicon: save the project first (so the slug exists), then upload.
for (const [id, kind, prev] of [['#logo', 'logo', '#logoPrev'], ['#favicon', 'favicon', '#favPrev']]) {
  $(id).onchange = (e) => busy(async () => {
    const f = e.target.files[0]; if (!f) return;
    if (!form.slug.value) throw new Error('Set the slug first');
    await persist();
    const dataUrl = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
    await api('POST', `asset/${cur.slug}/${kind}`, { dataUrl });
    showAsset($(prev), kind); log(`${kind} stored.`, 'ok');
  });
}

$('#previewBtn').onclick = () => busy(async () => {
  await persist(); const r = await api('POST', 'build/' + cur.slug); window.open(r.preview, '_blank');
});

$('#launchBtn').onclick = () => busy(async () => {
  await persist();
  if (!confirm(`Commit and push ${cur.owner}/${cur.repo || cur.slug} to GitHub (master + gh-pages)?`)) return;
  log('Launching…');
  const r = await api('POST', 'launch/' + cur.slug);
  log(r.log.join('\n'), r.ok ? 'ok' : 'err');
});

$('#dupBtn').onclick = () => open({ ...readForm(), slug: '', sub: '', repo: '', books: [] });
$('#delBtn').onclick = () => busy(async () => {
  if (!projects[cur.slug] || !confirm('Remove from this list? (The GitHub repo and local workspace folder are untouched.)')) return;
  await api('DELETE', 'projects/' + cur.slug); delete projects[cur.slug];
  cur = null; form.hidden = true; $('#empty').hidden = false; renderList();
});

api('GET', 'projects').then((p) => { projects = p; renderList(); });
</script>
</body>
</html>
