<dialog id="viewer" aria-labelledby="vtitle">
  <div class="vbar">
    <button id="vprev" type="button" class="btn">&larr; __T_PREV__</button>
    <button id="vnext" type="button" class="btn">__T_NEXT__ &rarr;</button>
    <span id="vtitle" class="vtitle"></span>
    <a id="vtab" class="btn" target="_blank" rel="noopener">__T_NEWTAB__ &#8599;</a>
    <button id="vclose" type="button" class="btn">__T_CLOSE__</button>
  </div>
  <iframe id="vframe" title="Reader" allowfullscreen></iframe>
</dialog>
